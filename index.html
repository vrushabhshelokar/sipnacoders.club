    <script>
      /* The intro plays once per visitor, so only a first-time visitor (or ?intro in the address) downloads its 74 KB script.
         Same rule as inside intro.js; document.write keeps the old behaviour of running before the app starts. */
      (function () {
        var seen = false;
        try { seen = !!window.localStorage.getItem('scc-intro-seen'); } catch (e) { /* storage blocked */ }
        try { seen = seen || !!window.sessionStorage.getItem('scc-intro-seen'); } catch (e) { /* storage blocked */ }
        if (!seen || /[?&]intro(=|&|$)/.test(window.location.search)) document.write('<script src="/intro/intro.js"><\/script>');
      })();
    </script>
